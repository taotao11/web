<script>
const S={
start:["后周显德元年","第一章 · 饥火","太祖末年","火还没有烧到城门","天刚亮，风从北面压下来。\n\n营地里没有炊烟。不是因为今日不做饭，而是已经没有什么可煮的了。\n\n昨夜有三个新兵偷了军粮，被老卒按在泥地里。你赶到时，其中一个已经没了气。\n\n亲兵递来一只空木碗。\n\n“赵都头，西仓说还够两日。”\n\n他顿了一下。\n\n“西仓的人说，最多一日。””,[["去查西仓","grain"],["让人把偷粮的新兵抬过来","soldier"],["什么也不说，先巡营","patrol"]]],
grain:["显德元年 · 春","第一章 · 饥火","西仓","一把米，能换多少人的命","西仓比你想象得更空。\n\n仓吏跪在地上：“赵都头，不是小人克扣。三日前，司里来过人，说要调一批粮。”\n\n角落里，一个抱孩子的妇人忽然笑了一声。\n\n“军爷，别问了。问了也没有粮。””,[["开仓","open"],["封仓，查账","audit"],["拿军令去找上官","appeal"]]],
soldier:["显德元年 · 春","第一章 · 饥火","营门","他们不是第一个偷粮的人","两个新兵跪在营门。年长的那个只有十七八岁。\n\n“家里还有四个人。”\n\n“前日，他们把我弟弟卖了。”\n\n他抬头：“赵都头，我没有偷。我只是拿回我自己的。””,[["按军法处置","punish"],["放他们回家","mercy"],["让他们带你去看家里","visit"]]],
patrol:["显德元年 · 春","第一章 · 饥火","营中","没人谈战争，所有人都在谈吃什么","你沿营栅走。有人在磨刀，有人在拆马鞍，还有人把一块皮革煮了三遍。\n\n一个老兵问：“城里还有肉吗？”\n\n对方沉默。\n\n远处忽然响起钟声。不是敌袭。是城里又有人死了。”,[["查钟声","bell"],["召集军官","officers"],["去看马厩","horses"]]],
open:["显德元年 · 午后","第一章 · 饥火","西仓","你打开了仓门","米落进木桶的声音很轻，营里的人却像听见了鼓。\n\n你命人按军籍分粮。第一轮没有人敢抢。第二轮开始，有人哭了。\n\n到傍晚，粮只剩不到三成。\n\n一个副将问：“你这样做，明日拿什么打仗？”\n\n夜里，一个孩子在营外问：“军爷，明天还有吗？””,[["把粮分给城中饥民","share"],["留下军粮","army"],["秘密派人抢回被调走的粮","seize"]]],
audit:["显德元年 · 午后","第一章 · 饥火","账房","账本比尸体更会说话","三本账放在一起，数字对不上。差额足够让营地再撑十二日。\n\n仓吏说：“粮不是被一个人拿走的，是一层一层被拿走的。每个人只拿一点，于是没有一个人觉得自己是罪人。”\n\n“您若真查到底，明日便有人来查您。””,[["查到底","truth"],["烧掉账本","burn"],["把账本交给上官","appeal"]]],
appeal:["显德元年 · 黄昏","第一章 · 饥火","上官府","门里的人吃得很好","你等了两个时辰。终于有人出来。\n\n“粮道断了。”\n\n“什么时候恢复？”\n\n“看天。”\n\n门缝里飘出肉香。那人低声说：“赵都头，别把事情做绝。””,[["忍下","gaoping"],["把话说死","death"],["记下这张脸","gaoping"]]],
punish:["显德元年 · 午后","第一章 · 饥火","军法","刀落下去的时候，没有人欢呼","军法执行得很快。年轻的新兵直到最后都没有哭。\n\n他一直问：“我娘怎么办？”\n\n当天夜里，营里没有人再偷粮。也没有人再与你说笑。”,[["继续巡营","gaoping"],["去找那个新兵的家人","visit"]]],
mercy:["显德元年 · 午后","第一章 · 饥火","营门","你放走了他们","两个年轻人消失在风里。当天夜里，三十七个人来找你。\n\n他们没有偷粮，只问：“若我们家里也快饿死了呢？”\n\n你第一次发现，宽恕也会成为一种命令。”,[["让军士分一部分口粮","share"],["告诉他们各自想办法","gaoping"]]],
visit:["显德元年 · 夜","第一章 · 饥火","城南","门后面的人","城南的街比营里安静，安静得不正常。\n\n一户人家门口坐着老妇人。她没有求粮，只问：“军爷，明日还打仗吗？”\n\n你说：“不知道。”\n\n她点头：“那就好。不打仗，孩子还能睡一夜。””,[["给她粮","share"],["问她城里发生了什么","bell"],["离开","gaoping"]]],
bell:["显德元年 · 夜","第一章 · 饥火","钟楼","钟声不是给活人报平安的","钟楼下躺着七个人。守钟人说，他们都是今天死的。\n\n“为什么敲钟？”\n\n“让家里人来领。”\n\n你问：“领回去做什么？”\n\n守钟人没有回答。\n\n风从巷子里吹出来。你忽然不想知道答案。”,[["留下帮忙","gaoping"],["离开","gaoping"],["问最近有没有陌生军队进城","gaoping"]]],
horses:["显德元年 · 夜","第一章 · 饥火","马厩","军马也会饿","二十七匹马已经瘦得见骨。马夫说有人昨夜割了一匹马。不是为了逃，是为了吃。\n\n“赵都头，若明日再断粮，您还护得住这些马吗？””,[["杀两匹救全营","gaoping"],["严禁动马","gaoping"],["把马迁出城","gaoping"]]],
share:["显德二年 · 春","第一章 · 余烬","余烬","你救下了一些人","你不知道救下了多少。第二天清晨，营门外多了几个人。有人把一块粗布放在门槛上。\n\n布上只有四个字：\n\n“赵军爷，活命。”\n\n这不是荣耀。只是乱世里最轻的一句感谢。\n\n更北面的战报已经到了。北汉来犯。柴荣决定亲征。”,[["整军","gaoping"],["留一部分人守城","gaoping"]]],
army:["显德元年 · 春","第一章 · 余烬","军营","你保住了军粮","军队撑过了最难的一夜。但城里没有。第三天，营门外出现了一排白布。\n\n有人说你是个好将领。城里的人却不这么想。\n\n北面的军报也到了。”,[["整军出发","gaoping"],["回头看看城里","bell"]]],
seize:["显德元年 · 夜","第一章 · 饥火","黑路","你第一次越过了线","你派出去的人带回了两车粮。他们还带回来一个消息：粮车属于一位与军中大人物关系密切的商人。\n\n副将问：“要不要还回去？”\n\n你看着那两车粮。没人说话。\n\n从这一夜开始，你知道自己已经有了仇家。”,[["分粮","gaoping"],["留下作为军需","gaoping"]]],
truth:["显德元年 · 夜","第一章 · 饥火","账本","有些名字不能现在念出来","你找到了三个名字。其中一个来自上官府，另一个来自军中。第三个名字后面没有官职，只有一个朱红印记。\n\n外面有人敲门：“赵都头，睡了吗？”\n\n你没有回答。”,[["把账本藏起来","gaoping"],["带着账本去见柴荣","gaoping"],["烧掉账本","gaoping"]]],
burn:["显德元年 · 夜","第一章 · 饥火","灰烬","火很快吞掉了纸","账本化成灰。你没有证据，也因此没有把柄。第二天，那个仓吏消失了。\n\n有时候不留下证据，本身也是一种选择。”,[["追查仓吏","gaoping"],["放下此事","gaoping"]]],
officers:["显德元年 · 午后","第一章 · 饥火","军议","没人愿意先说话","军官们坐成一排。每个人都知道粮不够。每个人也都在等别人先提出解决办法。\n\n最后，一个老将说：“打仗前先别让自己人饿死。”\n\n另一个人冷笑。\n\n“那你拿什么打？””,[["整军北上","gaoping"],["先稳住军心","gaoping"]]],
death:["显德元年","终局 · 一次错误","死亡","你死在门外","调令之后，你带着剩下的人离营。夜色里，伏兵等了很久。\n\n你甚至没有看见第一支箭从哪里来。\n\n赵匡胤，卒。\n\n历史没有走到陈桥。”,[["从存档继续","load"],["重新开始","restart"]]],
gaoping:["显德元年 · 四月","第二章 · 高平","高平","真正的战场没有选择题","后周军阵在风里展开。北汉兵已经压上来。右军先乱，有人开始退，有人已经跪下。\n\n柴荣亲自向前。你看见箭雨落下来。\n\n这一刻，过去所有选择留下的东西，都在你身边。有人信你，有人怕你，有人等你犯错。\n\n你只有很短的时间。”,[["率兵突击","victory"],["先稳住溃兵","honor"],["保护柴荣","trust"],["趁乱追击","power"]]],
victory:["显德元年 · 战后","第二章 · 高平","高平之后","你被看见了","你率兵压向北汉军阵。溃军开始后退。后周赢了。\n\n但你看见更多的是伤兵。有人喊万岁，也有人在找自己的兄弟。\n\n柴荣开始重新整顿禁军。你也被看见了。”,[["接受升迁","end"],["把功劳让给部下","end"]]],
honor:["显德元年 · 战后","第二章 · 高平","高平之后","你赢得了人的命","你没有成为战场上最耀眼的人，但你带回来的人更多。\n\n军中有人开始愿意把背后交给你。\n\n这是权力最慢的一种积累，也是最难失去的一种。”,[["保存","save"],["再试一次","restart"]]],
trust:["显德元年 · 战后","第二章 · 高平","高平之后","你挡在了柴荣前面","箭擦过你的肩。柴荣没有退，你也没有。\n\n战后，他问：“若今日败了呢？”\n\n你答：“那便一起死。”\n\n这是你们之间第一次真正的信任。”,[["继续","honor"],["保存","save"]]],
power:["显德元年 · 战后","第二章 · 高平","高平之后","你开始懂得权力","你把责任推给别人。你没有受到惩罚，甚至因此得到更多信任。\n\n你第一次明白：朝堂上的刀，未必比战场上的刀更钝。”,[["保存","save"],["再试一次","restart"]]],
end:["显德元年 · 战后","第二章 · 高平","尾声","你被看见了","高平之后，后周开始整顿禁军。真正的路不是战场，而是战场之后。\n\n有人开始向你靠拢，也有人开始记你的名字。\n\n多年以后，黄袍会落在谁的肩上，没人知道。至少现在，赵匡胤还只是赵匡胤。”,[["保存","save"],["再试一次","restart"]]]
};
function readState(){
  try{
    const raw=localStorage.getItem("zhao-auto");
    if(!raw)return {s:"start",n:0};
    const x=JSON.parse(raw);
    return x&&typeof x==="object"&&typeof x.s==="string"?x:{s:"start",n:0};
  }catch(e){
    try{localStorage.removeItem("zhao-auto")}catch(_){}
    return {s:"start",n:0};
  }
}
let st=readState();
function draw(){let x=S[st.s]||S.start;for(let i=0;i<4;i++);document.querySelector("#date").textContent=x[0];document.querySelector("#chapter").textContent=x[1];document.querySelector("#k").textContent=x[2];document.querySelector("#title").textContent=x[3];document.querySelector("#text").textContent=x[4];document.querySelector("#n").textContent=st.n;let c=document.querySelector("#choices");c.innerHTML="";x[5].forEach((v,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML="<b>"+["一","二","三","四"][i]+"</b>"+v[0];b.onclick=()=>go(v[1]);c.appendChild(b)})}
function persist(){
  try{localStorage.setItem("zhao-auto",JSON.stringify(st));return true}
  catch(e){return false}
}
function go(n){if(n==="restart"){restart();return}if(n==="save"){save(1);return}if(n==="load"){load(1);return}st.s=n;st.n++;persist();draw();scrollTo(0,0)}
function save(i){localStorage.setItem("zhao-slot-"+i,JSON.stringify(st));alert("存档已保存")}
function load(i){
  try{
    let x=localStorage.getItem("zhao-slot-"+i);
    if(!x){alert("这个存档位还是空的");return}
    const parsed=JSON.parse(x);
    if(!parsed||typeof parsed.s!=="string")throw new Error("bad save");
    st=parsed;persist();draw();
  }catch(e){
    alert("这个存档损坏了，已跳过");
  }
}
function restart(){if(confirm("重新开始？")){st={s:"start",n:0};persist();draw()}}
draw();
</script></html>
